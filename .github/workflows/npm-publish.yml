name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Scan public release content
        env:
          HODOR_PUBLIC_RELEASE_DENYLIST_B64: ${{ secrets.HODOR_PUBLIC_RELEASE_DENYLIST_B64 }}
        run: bun scripts/check-public-release.ts

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish to npm
        run: |
          npm --version
          VERSION=$(node -p "require('./package.json').version")
          TAG_ARGS=""
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARGS="--tag rc"
          fi
          npm publish --provenance --access public $TAG_ARGS
